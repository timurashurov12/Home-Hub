services:
  tv-hub:
    build: .
    image: tv-hub:latest
    container_name: tv-hub
    restart: unless-stopped
    # Host-сеть: контейнер видит домашнюю подсеть напрямую, работают автопоиск и mDNS.
    # Панель будет на http://localhost:${TVHUB_PORT} (по умолчанию 8765)
    network_mode: host
    environment:
      PORT: ${TVHUB_PORT:-8765}
      SCAN_SUBNETS: ${SCAN_SUBNETS:-}
    volumes:
      - tv-hub-data:/data
      - tv-hub-adb-keys:/root/.android

volumes:
  tv-hub-data:
  tv-hub-adb-keys:
