services:
  tv-hub:
    build: .
    image: tv-hub:latest
    container_name: tv-hub
    restart: unless-stopped
    # Host-сеть: контейнер видит домашнюю подсеть напрямую, работают автопоиск и mDNS.
    # Панель будет на http://localhost:${TVHUB_PORT} (по умолчанию 8765)
    network_mode: host
    environment:
      PORT: ${TVHUB_PORT:-8765}
      SCAN_SUBNETS: ${SCAN_SUBNETS:-}
      REDIS_URL: redis://127.0.0.1:${TVHUB_REDIS_PORT:-6390}
    depends_on:
      - redis
    volumes:
      - tv-hub-data:/data
      - tv-hub-adb-keys:/root/.android

  redis:
    image: redis:7-alpine
    container_name: tv-hub-redis
    restart: unless-stopped
    # Кеш мониторинга. Слушает только localhost и нестандартный порт, чтобы не мешать другим Redis.
    network_mode: host
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "${TVHUB_REDIS_PORT:-6390}", "--save", "60", "1", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - tv-hub-redis:/data

volumes:
  tv-hub-data:
  tv-hub-adb-keys:
  tv-hub-redis:
